<div class="promociones-container">
  <!-- 🔍 Barra superior -->
  <div class="top-bar">
    <div class="btn-group">
      <button class="btn-tab active">Promociones</button>
      <button class="btn-tab" (click)="irATendencias()">Tendencias</button>
    </div>
  </div>

  <!-- 🔶 Contenido principal -->
  <div class="content-section">
    <!-- 🧾 Nueva promoción -->
    <div class="card new-promo">
      <h3>Nueva promoción</h3>
      <form class="promo-form">
        <div class="form-grid">
          <!-- Campo Producto -->
          <div class="form-group">
            <label>Producto</label>
            <input type="text" placeholder="Nombre del producto" />
          </div>


          <!-- Campo Porcentaje o Valor -->
          <div class="form-group">
            <label>Porcentaje o valor de descuento</label>
            <input type="text" placeholder="Ej: 20% o $5000" />
          </div>

          <!-- Fecha de inicio -->
          <div class="form-group">
            <label>Fecha de inicio</label>
            <input type="date" />
          </div>

          <!-- Fecha de fin -->
          <div class="form-group">
            <label>Fecha de finalización</label>
            <input type="date" />
          </div>

        </div>

        <!-- Botón Guardar -->
        <button type="submit" class="btn-save">
          {{ indiceEdicion !== null ? 'Actualizar' : 'Guardar' }}
        </button>
      </form>

    </div>

    <!-- 📋 Lista de promociones -->
    <div class="card promo-list">
      <div class="list-header">
        <h3>Lista de promociones</h3>
        <input type="text" class="search-list" placeholder="Buscar..." />
      </div>

      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Descuentos</th>
            <th>Fechas</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Ravioles</td>
            <td>20%</td>
            <td>1 - 10 de sep</td>
            <td><button class="btn-edit">Editar</button></td>
          </tr>
          <tr>
            <td>Risotto</td>
            <td>20%</td>
            <td>13 - 25 de sep</td>
            <td><button class="btn-edit">Editar</button></td>
          </tr>
          <tr>
            <td>Papa boliviana</td>
            <td>15%</td>
            <td>18 - 30 de sep</td>
            <td><button class="btn-edit">Editar</button></td>
          </tr>
          <tr>
            <td>Ajiaco</td>
            <td>10%</td>
            <td>28 - 31 de ago</td>
            <td><button class="btn-edit">Editar</button></td>
          </tr>
          <tr>
            <td>Sancocho</td>
            <td>2x1</td>
            <td>3 - 12 de ago</td>
            <td><button class="btn-edit">Editar</button></td>
          </tr>
        </tbody>
      </table>

      <button class="btn-export">Exportar</button>
    </div>
  </div>
</div>

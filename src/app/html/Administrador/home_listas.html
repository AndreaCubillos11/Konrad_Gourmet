<div class="content">
    <div class="main-content">

        <!-- 🔹 Título general -->
        <div class="page-header">
            <i class="fa-solid fa-list-check"></i>
            <h2>Administración de Listas Desplegables</h2>
        </div>

        <!-- 🔹 Contenedor de tarjetas -->
        <div class="cards-container">

            <!-- 🏷️ Categorías de Producto -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-tags"></i>
                    <h3>Categorías de Producto</h3>
                </div>
                <div class="card-actions">
                    <input type="text" placeholder="Buscar categoría..." class="search" />
                    <button class="agregar" (click)="redirigirCrearLista('categorias-producto')">
                        <i class="fa-solid fa-plus"></i> Agregar
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Despensa</td>
                            <td>
                                <button class="btn-delete"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 🍽️ Categorías de Plato -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-utensils"></i>
                    <h3>Categorías de Plato</h3>
                </div>
                <div class="card-actions">
                    <input type="text" placeholder="Buscar categoría de plato..." class="search" />
                    <button class="agregar" (click)="redirigirCrearLista('categorias-plato')">
                        <i class="fa-solid fa-plus"></i> Agregar
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Entrada</td>
                            <td>
                                <button class="btn-delete"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 📏 Unidades -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-ruler"></i>
                    <h3>Unidades</h3>
                </div>
                <div class="card-actions">
                    <input type="text" placeholder="Buscar unidad..." class="search" />
                    <button class="agregar" (click)="redirigirCrearLista('unidades')">
                        <i class="fa-solid fa-plus"></i> Agregar
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Símbolo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Kilogramo</td>
                            <td>kg</td>
                            <td>
                                <button class="btn-delete"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 🏭 Marcas -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-industry"></i>
                    <h3>Marcas</h3>
                </div>
                <div class="card-actions">
                    <input type="text" placeholder="Buscar marca..." class="search" />
                    <button class="agregar" (click)="redirigirCrearLista('marcas')">
                        <i class="fa-solid fa-plus"></i> Agregar
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>La Campiña</td>
                            <td>
                                <button class="btn-delete"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 📦 Productos -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <h3>Productos</h3>
                </div>
                <div class="card-actions">
                    <input type="text" placeholder="Buscar producto..." class="search" />
                    <button class="agregar" (click)="redirigirCrearLista('productos')">
                        <i class="fa-solid fa-plus"></i> Agregar
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Unidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Arroz Premium</td>
                            <td>Despensa</td>
                            <td>kg</td>
                            <td>
                                <button class="btn-edit"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn-delete"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                        <!-- más filas dinámicas aquí -->
                    </tbody>
                </table>
            </div>


        </div>
    </div>
</div>
